spring.application.name=Book Mania

# Render injects PORT at runtime; 8080 is used for local development.
server.port=${PORT:8080}

# Database - point these at your local Postgres for dev. In production
# (Render + Neon) set a single DATABASE_URL variable to Neon's connection
# string (postgresql://user:pass@host/db?sslmode=require):
# DatabaseUrlEnvironmentPostProcessor detects it and overrides the three
# properties below automatically. Setting SPRING_DATASOURCE_* directly still
# works too if you'd rather not rely on that.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookmania_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool tuned so Neon can scale to zero. Neon suspends the compute
# after 5 minutes WITHOUT QUERIES; open-but-quiet connections don't stop it,
# periodic pings do. So:
# - minimum-idle=0 + idle-timeout=60s: no fixed connections, idle ones are
#   closed after a minute;
# - keepalive-time=0: HikariCP 6 (Spring Boot 3.5+) pings idle connections
#   every 2 minutes by default - that alone would keep Neon awake.
# Do NOT add keepalives or a short max-lifetime here.
#
# connection-timeout caps waiting for a connection (default 30s) and
# socketTimeout (seconds, pgjdbc) aborts a query whose socket goes silent,
# so a stuck DB call can't hold a request for long. The first request after
# Neon wakes up may take a second or two longer.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.data-source-properties.socketTimeout=30

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# Off by default - every query logged to stdout is noisy (and a little
# wasteful) in production. Set JPA_SHOW_SQL=true locally when you actually
# need to see the generated SQL.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Book.categories is LAZY, and listing a catalog page touches it for every
# book - without batching that's one extra SELECT per book (21 per page).
# This loads them for up to 50 books in a single IN (...) query instead.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# JWT - the default below is a DEV-ONLY placeholder, safe to keep in git.
# Always set JWT_SECRET_KEY explicitly in Render (and anywhere real users hit).
jwt.secret-key=${JWT_SECRET_KEY:lPYbGKa/krWZUN0FXtKGF8XizVkx6KeZwTLOR9Hp1ZBbma3KYRrPxzjEEe9Q4MPl}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS - comma-separated list of allowed frontend origins
# (production: the Vercel URL, e.g. https://bookmania.vercel.app).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Gzip JSON responses: a catalog page is ~7 KB raw, ~1.5 KB compressed.
# (application/json is in Boot's default mime-type list; tiny responses
# below 1 KB aren't worth compressing.)
server.compression.enabled=true
server.compression.min-response-size=1024

# Health check endpoint for Render's healthCheckPath (render.yaml).
# Render calls it every few seconds while the service is awake, so it must
# NOT query the database - otherwise Neon would never get its 5 quiet
# minutes and would stay awake (and billed) all the time.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.db.enabled=false
