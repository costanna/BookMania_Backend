spring.application.name=Book Mania

# Railway injects PORT at runtime; 8080 is used for local development.
server.port=${PORT:8080}

# Database - point these at your local Postgres for dev. In Railway, the
# simplest option is a single DATABASE_URL variable set to
# ${{ Postgres.DATABASE_URL }} (Postgres plugin's "Connect" tab default) -
# DatabaseUrlEnvironmentPostProcessor detects it and overrides the three
# properties below automatically. Setting SPRING_DATASOURCE_* directly still
# works too if you'd rather not rely on that.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookmania_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Railway can restart the Postgres container under the app (seen in
# production: "terminating connection due to administrator command" - the
# request in flight hung ~40s and then 500'd). These keep the pool from
# lending out dead connections and stop a stuck DB call from holding a
# request that long:
# - keepalive-time pings idle connections so dead ones get replaced before
#   a request borrows them;
# - max-lifetime recycles every connection after 10 min regardless;
# - connection-timeout caps waiting for a connection (default is 30s);
# - socketTimeout (seconds, pgjdbc) aborts a query whose socket goes silent.
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.data-source-properties.socketTimeout=30

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# Off by default - every query logged to stdout is noisy (and a little
# wasteful) in production. Set JPA_SHOW_SQL=true locally when you actually
# need to see the generated SQL.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Book.categories is LAZY, and listing a catalog page touches it for every
# book - without batching that's one extra SELECT per book (21 per page).
# This loads them for up to 50 books in a single IN (...) query instead.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# JWT - the default below is a DEV-ONLY placeholder, safe to keep in git.
# Always set JWT_SECRET_KEY explicitly in Railway (and anywhere real users hit).
jwt.secretKey=${JWT_SECRET_KEY:lPYbGKa/krWZUN0FXtKGF8XizVkx6KeZwTLOR9Hp1ZBbma3KYRrPxzjEEe9Q4MPl}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS - comma-separated list of allowed frontend origins.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Gzip JSON responses: a catalog page is ~7 KB raw, ~1.5 KB compressed.
# (application/json is in Boot's default mime-type list; tiny responses
# below 1 KB aren't worth compressing.)
server.compression.enabled=true
server.compression.min-response-size=1024

# Health check endpoint for Railway's deploy healthcheck.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
