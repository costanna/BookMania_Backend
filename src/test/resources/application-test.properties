# Used by tests that boot the full Spring context (@ActiveProfiles("test")):
# an in-memory H2 in PostgreSQL mode instead of the real Postgres, so they
# run anywhere without a database server.
spring.datasource.url=jdbc:h2:mem:bookmania;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
